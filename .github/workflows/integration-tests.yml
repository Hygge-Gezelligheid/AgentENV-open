name: Integration Tests
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the original failing test
        run: |
          make build-ublk PROFILE=debug
          cargo test -p agentenv --test integration --no-run
      - name: Compare runtime and kernel combinations
        run: |
          set -eu
          mkdir -p /tmp/ci-diag/assets /tmp/ci-diag/evidence
          lscpu > /tmp/ci-diag/evidence/cpu.txt
          uname -a > /tmp/ci-diag/evidence/host.txt
          curl -fL --retry 3 https://github.com/kvcache-ai/firecracker/releases/download/aenv-deps/vmlinux-6.1.175-x86_64 -o /tmp/ci-diag/assets/vmlinux-old
          curl -fL --retry 3 https://github.com/kvcache-ai/firecracker/releases/download/aenv-deps/firecracker-1.15.1-patch-v1-x86_64.tgz -o /tmp/ci-diag/assets/fc-old.tgz
          tar xf /tmp/ci-diag/assets/fc-old.tgz -C /tmp/ci-diag/assets
          python3 scripts/tests/diagnose-ci.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-kernel-diagnostic
          path: /tmp/ci-diag/evidence
